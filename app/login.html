<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입장 — PORTRI AI</title>
<link rel="stylesheet" href="styles.css">
<style>
.auth { min-height:calc(100vh - var(--nav-h)); display:grid; grid-template-columns:1.05fr 1fr; }

/* 좌: 브랜드 패널 */
.auth-brand { background:var(--grad); color:#fff; padding:clamp(40px,5.5vw,72px);
  display:flex; flex-direction:column; justify-content:space-between; gap:40px; position:relative; overflow:hidden; }
.auth-brand::after { content:''; position:absolute; right:-80px; bottom:-80px; width:300px; height:300px;
  border-radius:50%; background:rgba(255,255,255,0.08); }
.auth-logo { display:inline-flex; align-items:center; gap:10px; font-weight:700; font-size:20px; color:#fff; letter-spacing:-0.02em; z-index:1; }
.auth-logo:hover { text-decoration:none; opacity:.92; }
.auth-logo .mark { width:32px; height:32px; border-radius:9px; background:rgba(255,255,255,0.22);
  display:inline-flex; align-items:center; justify-content:center; font-size:17px; }
.auth-tagline { font-size:clamp(1.7rem,2.6vw,2.4rem); line-height:1.24; letter-spacing:-0.02em; color:#fff; }
.auth-lead { margin-top:14px; color:rgba(255,255,255,0.9); max-width:34ch; line-height:1.55; }
.auth-benefits { list-style:none; margin-top:30px; display:flex; flex-direction:column; gap:15px; z-index:1; }
.auth-benefits li { display:flex; align-items:center; gap:13px; font-size:15px; color:rgba(255,255,255,0.96); }
.auth-benefits .ic { width:38px; height:38px; border-radius:11px; background:rgba(255,255,255,0.16); flex:none;
  display:inline-flex; align-items:center; justify-content:center; font-size:18px; }
.auth-fine { font-size:12.5px; color:rgba(255,255,255,0.72); z-index:1; }

/* 우: 폼 */
.auth-form { display:flex; align-items:center; justify-content:center; padding:clamp(28px,5vw,56px); background:var(--surface-white); }
.auth-card { width:100%; max-width:400px; }
.social-btn { flex:1; justify-content:center; cursor:not-allowed; }
.social-btn:not(:disabled) { cursor:pointer; }
.social-btn:not(:disabled):hover { background:var(--accent-tint); border-color:transparent; }

@media(max-width:820px){
  .auth { grid-template-columns:1fr; }
  .auth-brand { padding:30px 24px; gap:18px; }
  .auth-brand::after { display:none; }
  .auth-lead, .auth-benefits, .auth-fine { display:none; }
  .auth-tagline { font-size:1.5rem; }
}
</style>
</head>
<body>
<nav class="nav" data-nav></nav>

<section class="auth">
  <!-- 브랜드 패널 -->
  <div class="auth-brand">
    <a class="auth-logo" href="home.html"><span class="mark">P</span> PORTRI AI</a>
    <div>
      <h2 class="auth-tagline">경험을 역량으로,<br>역량을 증명으로.</h2>
      <p class="auth-lead">AI가 나의 경험에서 역량을 찾아내고, 이력서·자기소개서·포트폴리오까지 완성합니다.</p>
      <ul class="auth-benefits">
        <li><span class="ic">📊</span> 경험에서 K-CESA 6대 역량을 증거와 함께 추출</li>
        <li><span class="ic">📈</span> 교과·비교과를 누적해 성장을 추적</li>
        <li><span class="ic">📄</span> 축적된 데이터로 문서를 자동 생성</li>
      </ul>
    </div>
    <p class="auth-fine">데모 데이터는 이 브라우저에만 저장됩니다.</p>
  </div>

  <!-- 폼 -->
  <div class="auth-form">
    <div class="auth-card">
      <p class="eyebrow">PORTRI AI</p>
      <h2 class="mt-2" id="formTitle">당신의 아카이브에 입장</h2>
      <p class="muted mt-1" id="formSub">증거로 검증된 역량이 기다립니다.</p>

      <form class="mt-4" onsubmit="return doLogin(event)">
        <div id="nameField" class="hidden" style="margin-bottom:var(--s-2)">
          <label class="label">이름</label>
          <input class="field" id="nameInput" type="text" placeholder="홍길동" autocomplete="name">
        </div>
        <div style="margin-bottom:var(--s-2)">
          <label class="label">이메일</label>
          <input class="field" id="emailInput" type="email" placeholder="you@university.ac.kr" required autocomplete="email">
        </div>
        <div>
          <label class="label">비밀번호</label>
          <input class="field" id="pwInput" type="password" placeholder="8자 이상" required minlength="8" autocomplete="current-password">
          <p class="fine mt-1" id="pwHint">최소 8자 이상.</p>
        </div>
        <p id="errMsg" class="fine hidden" style="color:#c0392b;margin-top:8px"></p>
        <button class="btn btn--grad" id="submitBtn" type="submit" style="width:100%;margin-top:var(--s-3)">입장</button>
      </form>

      <div class="mt-4 center">
        <span class="caption" id="socialLabel">소셜 로그인 (준비 중)</span>
        <div class="btn-row mt-2">
          <button class="chip social-btn" id="btnKakao" disabled title="관리자가 아직 설정하지 않았습니다" onclick="loginWithKakao()">카카오</button>
          <button class="chip social-btn" id="btnNaver" disabled title="관리자가 아직 설정하지 않았습니다" onclick="loginWithNaver()">네이버</button>
          <button class="chip social-btn" id="btnGoogle" disabled title="관리자가 아직 설정하지 않았습니다" onclick="loginWithGoogle()">Google</button>
        </div>
        <p class="fine mt-2 hidden" id="socialErr" style="color:#c0392b"></p>
      </div>

      <p class="center mt-4 caption">
        <span id="toggleText">아직 계정이 없나요?</span>
        <a href="#" class="link" onclick="return toggleMode()"><span id="toggleLink">회원가입</span></a>
      </p>
    </div>
  </div>
</section>

<script src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" integrity="sha384-DKYJZ8NLiK8MN4/C5P2dtSmLQ4KwPaoqAfyA/DfmEc1VDxu4yyC7wy6K1Hs90nka" crossorigin="anonymous"></script>
<script>
mountNav('login');

/* ============================================================
   소셜 로그인 설정 — 각 플랫폼 개발자 콘솔에서 발급받은 값을 넣으세요.
   비워두면 해당 버튼은 자동으로 비활성 상태("준비 중")로 남습니다.
   - Google:  https://console.cloud.google.com/apis/credentials
              → "OAuth 클라이언트 ID" 만들기 → 애플리케이션 유형: 웹 애플리케이션
              → 승인된 자바스크립트 원본에 아래 두 개를 추가:
                http://localhost:8125
                https://hee99999-create.github.io
              → 생성된 "클라이언트 ID"를 아래 google.clientId에 붙여넣기
   - 카카오:   https://developers.kakao.com → 내 애플리케이션 → 앱 만들기
              → 제품 설정 > 카카오 로그인 > 일반: 사용 설정 ON, 동의항목에서 닉네임 설정
              → 앱 > 플랫폼 키 > JavaScript 키 카드 클릭 > "카카오 로그인 리다이렉트 URI"에
                이 로그인 페이지 주소 등록(localhost·github.io 둘 다) 후 저장
              → JavaScript 키 → kakao.jsKey, REST API 키 → kakao.restKey (둘 다 공개 식별자)
   - 네이버:   https://developers.naver.com/apps → 애플리케이션 등록
              → 사용 API: "네이버 로그인" 추가
              → 서비스 URL / Callback URL에 이 로그인 페이지 주소를 각각 등록
                (예: https://hee99999-create.github.io/portfolio/app/login.html)
              → 발급된 "Client ID"를 아래 naver.clientId에 붙여넣기
   ============================================================ */
const SOCIAL_CONFIG = {
  google: { clientId: '939497549606-un0pd1oop8aar138ogln8e0phucmas1m.apps.googleusercontent.com' },
  kakao:  { jsKey: 'c485133750df53e64f631b12aee48fb9', restKey: '455b4c6837e359d73d57b188e56af0aa' },
  naver:  { clientId: '' },
};

(function initSocialButtons() {
  const anyConfigured = !!(SOCIAL_CONFIG.google.clientId || SOCIAL_CONFIG.kakao.jsKey || SOCIAL_CONFIG.naver.clientId);
  document.getElementById('socialLabel').textContent = anyConfigured ? '소셜 로그인' : '소셜 로그인 (준비 중)';

  if (SOCIAL_CONFIG.google.clientId) {
    const btn = document.getElementById('btnGoogle');
    btn.disabled = false; btn.removeAttribute('title');
  }
  if (SOCIAL_CONFIG.kakao.jsKey) {
    const btn = document.getElementById('btnKakao');
    btn.disabled = false; btn.removeAttribute('title');
    if (window.Kakao && !Kakao.isInitialized()) Kakao.init(SOCIAL_CONFIG.kakao.jsKey);
  }
  if (SOCIAL_CONFIG.naver.clientId) {
    const btn = document.getElementById('btnNaver');
    btn.disabled = false; btn.removeAttribute('title');
  }
})();

function showSocialError(msg) {
  const el = document.getElementById('socialErr');
  el.textContent = msg; el.classList.remove('hidden');
}

/* ---- Google: Identity Services 토큰 클라이언트(암묵적 흐름) — 백엔드/시크릿 불필요 ---- */
function loginWithGoogle() {
  if (!window.google || !SOCIAL_CONFIG.google.clientId) return;
  const client = google.accounts.oauth2.initTokenClient({
    client_id: SOCIAL_CONFIG.google.clientId,
    scope: 'openid email profile',
    callback: async (resp) => {
      if (!resp || !resp.access_token) { showSocialError('Google 로그인이 취소되었거나 실패했어요.'); return; }
      try {
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: 'Bearer ' + resp.access_token },
        });
        if (!r.ok) throw new Error('프로필 조회 실패');
        const profile = await r.json();
        Session.login(profile.email || '', profile.name || '', 'google');
        location.href = next;
      } catch (e) {
        showSocialError('Google 프로필을 가져오지 못했어요. 다시 시도해주세요.');
      }
    },
  });
  client.requestAccessToken();
}

/* ---- 카카오: 전체 페이지 리다이렉트(인가 코드 흐름) — 이 페이지가 콜백 역할도 겸함 ----
   카카오 JS SDK v2는 팝업 로그인(Auth.login)을 지원하지 않아 Auth.authorize로 전체
   페이지를 리다이렉트한다. 돌아올 때 쿼리에 담긴 인가 코드는 백엔드의
   /oauth/kakao-token(코드→토큰 교환)과 /oauth/kakao-profile(프로필 조회) 프록시를
   거친다 — 둘 다 브라우저에서 카카오 API를 직접 호출하면 CORS로 막히기 때문이고,
   클라이언트 시크릿은 어디에도 사용하지 않는다. */
function loginWithKakao() {
  if (!window.Kakao || !SOCIAL_CONFIG.kakao.jsKey) return;
  const state = Math.random().toString(36).slice(2);
  sessionStorage.setItem('cda_kakao_state', state);
  Kakao.Auth.authorize({
    redirectUri: location.origin + location.pathname,
    state,
  });
}

/* 카카오 리다이렉트로 돌아온 경우 처리 (URL 쿼리에 code 포함) */
(async function handleKakaoCallback() {
  const qs = new URLSearchParams(location.search);
  const code = qs.get('code');
  if (!code) return;
  const state = qs.get('state');
  qs.delete('code'); qs.delete('state'); qs.delete('error'); qs.delete('error_description');
  const cleanQs = qs.toString();
  history.replaceState(null, '', location.pathname + (cleanQs ? '?' + cleanQs : ''));
  if (!state || state !== sessionStorage.getItem('cda_kakao_state')) {
    showSocialError('카카오 로그인 검증에 실패했어요. 다시 시도해주세요.');
    return;
  }
  sessionStorage.removeItem('cda_kakao_state');
  try {
    const tokenRes = await fetch(API_BASE + '/oauth/kakao-token', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        code,
        redirect_uri: location.origin + location.pathname,
        client_id: SOCIAL_CONFIG.kakao.restKey,
      }),
    });
    if (!tokenRes.ok) throw new Error('토큰 발급 실패');
    const { access_token } = await tokenRes.json();
    const profileRes = await fetch(API_BASE + '/oauth/kakao-profile', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token }),
    });
    if (!profileRes.ok) throw new Error('프로필 조회 실패');
    const res = await profileRes.json();
    const email = res.kakao_account && res.kakao_account.email || '';
    const name = (res.kakao_account && res.kakao_account.profile && res.kakao_account.profile.nickname)
      || (res.properties && res.properties.nickname) || '카카오 사용자';
    Session.login(email, name, 'kakao');
    location.href = next;
  } catch (e) {
    showSocialError('카카오 로그인에 실패했어요. 잠시 후 다시 시도해주세요.');
  }
})();

/* ---- 네이버: 전체 페이지 리다이렉트(암묵적 흐름) — 이 페이지가 콜백 역할도 겸함 ----
   프로필 조회는 브라우저에서 네이버 API를 직접 호출하면 CORS로 막히므로,
   백엔드의 /oauth/naver-profile 프록시(토큰만 전달, 시크릿 불필요)를 거친다. */
function loginWithNaver() {
  if (!SOCIAL_CONFIG.naver.clientId) return;
  const state = Math.random().toString(36).slice(2);
  sessionStorage.setItem('cda_naver_state', state);
  const redirectUri = location.origin + location.pathname; // 이 로그인 페이지 자체
  const url = 'https://nid.naver.com/oauth2.0/authorize'
    + '?response_type=token'
    + '&client_id=' + encodeURIComponent(SOCIAL_CONFIG.naver.clientId)
    + '&redirect_uri=' + encodeURIComponent(redirectUri)
    + '&state=' + encodeURIComponent(state);
  location.href = url;
}

/* 네이버 리다이렉트로 돌아온 경우 처리 (URL 해시에 access_token 포함) */
(async function handleNaverCallback() {
  if (!location.hash.includes('access_token=')) return;
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get('access_token');
  const state = params.get('state');
  history.replaceState(null, '', location.pathname + location.search); // 해시 정리(토큰 URL에 남기지 않기)
  if (!token || state !== sessionStorage.getItem('cda_naver_state')) {
    showSocialError('네이버 로그인 검증에 실패했어요. 다시 시도해주세요.');
    return;
  }
  sessionStorage.removeItem('cda_naver_state');
  try {
    const r = await fetch(API_BASE + '/oauth/naver-profile', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token: token }),
    });
    if (!r.ok) throw new Error('프로필 조회 실패');
    const data = await r.json();
    const p = data.response || {};
    Session.login(p.email || '', p.name || p.nickname || '네이버 사용자', 'naver');
    location.href = next;
  } catch (e) {
    showSocialError('네이버 로그인에 실패했어요. 잠시 후 다시 시도해주세요.');
  }
})();
let signup = false;
const params = new URLSearchParams(location.search);
const next = params.get('next') || 'dashboard.html';

function toggleMode() {
  signup = !signup;
  document.getElementById('nameField').classList.toggle('hidden', !signup);
  document.getElementById('formTitle').textContent = signup ? '아카이브 만들기' : '당신의 아카이브에 입장';
  document.getElementById('formSub').textContent = signup ? '첫 경험부터 증거로 남깁니다.' : '증거로 검증된 역량이 기다립니다.';
  document.getElementById('submitBtn').textContent = signup ? '가입하고 입장' : '입장';
  document.getElementById('toggleText').textContent = signup ? '이미 계정이 있나요?' : '아직 계정이 없나요?';
  document.getElementById('toggleLink').textContent = signup ? '로그인' : '회원가입';
  document.getElementById('pwHint').textContent = signup ? '최소 8자 이상으로 설정하세요.' : '최소 8자 이상.';
  document.getElementById('pwInput').setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
  return false;
}
function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('emailInput').value.trim();
  const pw = document.getElementById('pwInput').value;
  const err = document.getElementById('errMsg');
  if (pw.length < 8) { err.textContent = '비밀번호는 8자 이상이어야 합니다.'; err.classList.remove('hidden'); return false; }
  if (signup && !document.getElementById('nameInput').value.trim()) { err.textContent = '이름을 입력해 주세요.'; err.classList.remove('hidden'); return false; }
  Session.login(email);
  location.href = next;
  return false;
}
</script>
</body>
</html>
