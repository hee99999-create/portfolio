<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 선배 — PORTRI AI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav" data-nav></nav>

<div class="subnav">
  <a class="link" href="dashboard.html">‹ 경력관리</a>
  <span class="subnav__title" style="margin-left:12px">AI 선배</span>
  <span class="subnav__spacer"></span>
  <span class="caption" id="engineNote"></span>
</div>

<section class="tile tile--white compact">
  <div class="container prose">
    <p class="caption">AI 선배 · 진로 코칭</p>
    <h1 style="font-size:clamp(1.7rem,3.3vw,2.5rem)">너의 활동을 보니, 이런 길이 보여</h1>
    <p class="lead mt-2">누적한 활동과 K-CESA 역량을 통째로 분석해서, 앞으로의 진로·취업 방향을 짚어줄게.</p>
  </div>
</section>

<section class="tile tile--parchment" style="min-height:52vh">
  <div class="container" style="max-width:900px">
    <div id="loading" class="empty">
      <h3 class="faint">AI 선배가 너의 활동을 살펴보는 중…</h3>
      <p class="empty__hint">누적 경험과 역량을 종합하고 있어요.</p>
    </div>
    <div id="empty" class="empty hidden">
      <h3>먼저 경험을 등록해줘</h3>
      <p class="empty__hint">활동이 있어야 진로를 조언할 수 있어요.</p>
      <div class="btn-row mt-4" style="justify-content:center"><a class="btn btn--primary" href="dashboard.html">경력관리로</a></div>
    </div>
    <div id="advice"></div>
  </div>
</section>

<footer class="footer" data-footer></footer>

<script src="app.js"></script>
<script>
mountNav('competency'); mountFooter();
if (requireAuth()) {
  Store.seedIfEmpty();
  const items = Store.items;
  const agg = aggregateKCESA();
  const $ = s => document.getElementById(s);

  if (items.length === 0) {
    $('loading').classList.add('hidden');
    $('empty').classList.remove('hidden');
  } else {
    const profile = {
      competencies: agg.labels.map((l, i) => ({ name: l, score: agg.mine[i] })),
      categories: CATEGORIES.map(c => ({ label: c.label, count: Store.byCategory(c.key).length })).filter(x => x.count > 0),
      experiences: items.map(x => ({ title: x.title, category: CAT[x.category]?.label })),
    };
    (async () => {
      const ai = await adviseBackend(profile);      // 백엔드 있으면 실제 AI
      const a = ai || careerAdviceMock(agg, items); // 없으면 규칙 기반
      $('engineNote').textContent = ai ? '🟢 AI 분석' : '⚪ 규칙 기반(백엔드 꺼짐)';
      $('engineNote').style.color = ai ? '#2e7d46' : 'var(--ink-faint)';
      render(a);
    })();
  }

  function render(a) {
    $('loading').classList.add('hidden');
    const careers = (a.careers || []).map(c =>
      `<div class="card"><strong style="font-size:1.05rem">${c.role}</strong><p class="mt-1 muted" style="font-size:14px">${c.why}</p></div>`).join('');
    const gaps = (a.gaps || []).map(g => `<div class="mt-1">• ${g}</div>`).join('');
    const acts = (a.next_actions || []).map(g => `<div class="mt-1">• ${g}</div>`).join('');
    $('advice').innerHTML = `
      <div class="soft-card fade-up"><div class="caption">강점 요약</div>
        <p class="mt-1" style="font-size:1.05rem;line-height:1.7">${a.strengths}</p></div>

      <h3 class="mt-5">추천 진로 · 직무</h3>
      <div class="grid-2 mt-2">${careers}</div>

      <div class="grid-2 mt-4">
        <div class="soft-card"><div class="caption">지금 부족한 것</div>${gaps}</div>
        <div class="soft-card"><div class="caption">다음에 쌓으면 좋을 것</div>${acts}</div>
      </div>

      <div class="tile--gradient mt-5" style="border-radius:18px;padding:var(--s-4)">
        <p style="font-size:1.15rem;font-weight:600">${a.encouragement}</p>
        <div class="btn-row mt-3">
          <a class="btn btn--onDark" href="studio.html" style="color:var(--color-primary)">문서로 정리하기 ›</a>
          <a class="btn" href="dashboard.html" style="background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)">경험 더 등록 ›</a>
        </div>
      </div>
      <p class="fine mt-3">※ 이 조언은 등록된 활동·역량 데이터에 근거합니다. 데이터가 쌓일수록 정확해져요.</p>`;
  }
}
</script>
</body>
</html>
