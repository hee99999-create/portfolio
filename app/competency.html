<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>역량 그래프 — Career Data Account</title>
<link rel="stylesheet" href="styles.css">
<style>
.chart-card { background:#fff; border:1px solid var(--hairline); border-radius:var(--r-card); padding:var(--s-4); }
.chart-box { position:relative; height:340px; }
.legend { display:flex; flex-wrap:wrap; gap:16px; margin-top:16px; }
.legend span { display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft); }
.dot { width:12px; height:12px; border-radius:3px; flex:none; }
table.kc { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
table.kc th, table.kc td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--hairline); }
table.kc th { font-size:12px; color:var(--ink-faint); font-weight:600; }
table.kc td.n { text-align:right; font-variant-numeric:tabular-nums; }
.mine { color:var(--color-primary); font-weight:600; }
</style>
</head>
<body>
<nav class="nav" data-nav></nav>

<div class="subnav">
  <span class="subnav__title">역량 그래프</span>
  <span class="caption" style="margin-left:12px">K-CESA 6대 핵심역량</span>
  <span class="subnav__spacer"></span>
  <a class="link" href="dashboard.html">경력관리 ›</a>
</div>

<section class="tile tile--white compact">
  <div class="container">
    <h2>나의 역량, 한눈에</h2>
    <p class="muted mt-1">교과(성적)와 비교과(경력관리)의 증거로 계산된 K-CESA 역량입니다. 학과·동일학년 평균과 비교해 보세요.</p>
    <p class="fine mt-1" id="srcNote">※ 평균값은 데모용 예시입니다.</p>
    <div class="btn-row mt-2" id="curCta"></div>
  </div>
</section>

<section class="tile tile--parchment">
  <div class="container grid-2" style="align-items:start">
    <div class="chart-card">
      <h3>역량별 비교 (막대)</h3>
      <div class="chart-box mt-3"><canvas id="barChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>역량 프로필 (레이더)</h3>
      <div class="chart-box mt-3"><canvas id="radarChart"></canvas></div>
    </div>
  </div>

  <div class="container mt-4">
    <div class="chart-card">
      <div class="flex between items-center"><h3>역량 점수표</h3><span class="caption">0–100 척도</span></div>
      <div style="overflow-x:auto"><table class="kc" id="kcTable"></table></div>
    </div>
  </div>
</section>

<footer class="footer" data-footer></footer>

<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
mountNav('competency'); mountFooter();
if (requireAuth()) {
  Store.seedIfEmpty();
  const agg = aggregateKCESA();
  const labels = agg.labels;

  // 교과역량 반영 안내
  const note = document.getElementById('srcNote');
  const cta = document.getElementById('curCta');
  if (agg.hasCurricular) {
    note.textContent = '※ 교과 + 비교과 통합. 평균값은 데모용 예시입니다.';
    cta.innerHTML = '<a class="chip chip--selectable" href="curricular.html">교과역량 다시 분석 ›</a>';
  } else {
    note.textContent = '※ 현재 비교과(경력관리)만 반영됨. 평균값은 데모용 예시입니다.';
    cta.innerHTML = '<a class="btn btn--ghost" href="curricular.html" style="padding:7px 16px;font-size:14px">+ 교과역량 추가하기 (성적 입력)</a>';
  }
  const COLORS = { mine:'#e75f3a', dept:'#2f6f9f', gradeAll:'#1d9e75', gradeDept:'#b07a1a' };
  const series = [
    { name:'나의역량', color:COLORS.mine, data:agg.mine, mine:true },
    { name:'학과평균', color:COLORS.dept, data:KCESA_AVG['학과평균'] },
    { name:'동일학년 전체평균', color:COLORS.gradeAll, data:KCESA_AVG['동일학년 전체평균'] },
    { name:'동일학년 학과평균', color:COLORS.gradeDept, data:KCESA_AVG['동일학년 학과평균'] },
  ];

  const inkFaint = '#8c8272', grid = 'rgba(140,130,114,0.15)';
  Chart.defaults.font.family = "'Inter','Pretendard Variable',sans-serif";
  Chart.defaults.color = inkFaint;

  // 막대
  new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: { labels, datasets: series.map(s => ({
      label: s.name, data: s.data, backgroundColor: s.color,
      borderRadius: 4, borderSkipped: false,
      barPercentage: 0.8, categoryPercentage: 0.78,
    })) },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales: { y:{ beginAtZero:true, max:100, grid:{color:grid} }, x:{ grid:{display:false}, ticks:{font:{size:11}} } },
      plugins: { legend:{ position:'bottom', labels:{ boxWidth:12, boxHeight:12, usePointStyle:true, pointStyle:'rectRounded', padding:14 } } },
    }
  });

  // 레이더
  new Chart(document.getElementById('radarChart'), {
    type: 'radar',
    data: { labels, datasets: series.map(s => ({
      label: s.name, data: s.data,
      borderColor: s.color, backgroundColor: s.mine ? 'rgba(231,95,58,0.14)' : 'transparent',
      borderWidth: s.mine ? 2.5 : 1.5, pointRadius: s.mine ? 4 : 2.5,
      pointBackgroundColor: s.color, fill: s.mine,
    })) },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales: { r:{ min:0, max:100, ticks:{ stepSize:20, backdropColor:'transparent', font:{size:10} },
        grid:{color:grid}, angleLines:{color:grid}, pointLabels:{ font:{size:12}, color:'#6b6155' } } },
      plugins: { legend:{ position:'bottom', labels:{ boxWidth:12, boxHeight:12, usePointStyle:true, pointStyle:'rectRounded', padding:14 } } },
    }
  });

  // 표
  document.getElementById('kcTable').innerHTML =
    `<thead><tr><th>역량</th>${series.map(s=>`<th style="text-align:right">${s.name}</th>`).join('')}<th style="text-align:right">활동수</th></tr></thead>
     <tbody>${labels.map((l,i)=>`<tr><td>${l}</td>${series.map(s=>`<td class="n ${s.mine?'mine':''}">${s.data[i]}</td>`).join('')}<td class="n">${agg.counts[i]}</td></tr>`).join('')}</tbody>`;
}
</script>
</body>
</html>
