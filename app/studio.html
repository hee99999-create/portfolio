<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서 만들기 — PORTRI AI</title>
<link rel="stylesheet" href="styles.css">
<style>
.doc { background:#fff; border:1px solid var(--hairline); border-radius:16px; padding:56px 60px; max-width:820px; margin:0 auto; box-shadow:var(--shadow-card); }
.doc.editing { outline:2px dashed var(--color-primary); outline-offset:8px; }
.doc-head { border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:6px; }
.doc-eyebrow { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--color-primary); font-weight:700; }
.doc h1.doc-t { font-family:var(--font-serif); font-size:2.3rem; letter-spacing:-.01em; margin-top:6px; line-height:1.1; }
.doc-sub { color:var(--ink-faint); font-size:14px; margin-top:8px; }
.doc-photo { width:104px; height:132px; object-fit:cover; border-radius:8px; border:1px solid var(--hairline); flex:none; }
.doc-section { margin-top:var(--s-5); }
.doc-section h3 { font-size:1.02rem; letter-spacing:.02em; padding-bottom:6px; margin-bottom:12px; border-bottom:1px solid var(--hairline); color:var(--color-primary); }
.res-row { display:grid; grid-template-columns:130px 1fr; gap:16px; padding:12px 0; border-bottom:1px solid var(--pearl-ring); }
.res-date { color:var(--ink-faint); font-size:14px; }
.pf-item { padding:var(--s-3) 0; border-bottom:1px solid var(--pearl-ring); }
.pf-gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-bottom:12px; }
.pf-gallery.one { grid-template-columns:1fr; }
.pf-gallery figure { margin:0; }
.pf-gallery img { width:100%; height:150px; object-fit:cover; border-radius:10px; border:1px solid var(--hairline); }
.pf-gallery.one img { height:auto; max-height:340px; border-radius:12px; }
.pf-gallery figcaption { font-size:12px; color:var(--ink-faint); margin-top:5px; }
.thumb { position:relative; display:inline-block; }
.thumb img { width:110px; height:70px; object-fit:cover; border-radius:6px; border:1px solid var(--hairline); display:block; }
.thumb button { position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; border:none; background:var(--ink); color:#fff; font-size:11px; line-height:1; cursor:pointer; }
.imgblk { display:inline-flex; flex-direction:column; gap:4px; width:110px; }
.imgcap { height:30px !important; font-size:12px; padding:3px 8px; }
.imgmove { display:flex; gap:4px; }
.imgmove button { flex:1; border:1px solid var(--hairline); background:#fff; border-radius:6px; cursor:pointer; font-size:11px; padding:2px; }
/* 이력서 템플릿 5종 */
.doc.tpl-compact { padding:38px 46px; }
.doc.tpl-compact .doc-section { margin-top:var(--s-3); }
.doc.tpl-compact .res-row { padding:8px 0; }
.doc.tpl-compact h1.doc-t { font-size:1.85rem; }
.doc.tpl-modern .doc-head { border-bottom:none; }
.doc.tpl-modern h1.doc-t { font-size:2.7rem; }
.doc.tpl-modern .doc-section h3 { border-bottom:none; border-left:4px solid var(--color-primary); padding-left:10px; margin-bottom:14px; }
.doc.tpl-minimal .doc-head { border-bottom:none; text-align:center; }
.doc.tpl-minimal .doc-section h3 { border-bottom:none; color:var(--ink); letter-spacing:.12em; text-transform:uppercase; font-size:.82rem; }
.rz-side { display:grid; grid-template-columns:230px 1fr; gap:28px; }
.rz-side aside { border-right:1px solid var(--hairline); padding-right:24px; }
.rz-side aside .doc-photo { width:100%; height:auto; aspect-ratio:3/4; margin-bottom:6px; }
.rz-side main { min-width:0; }
@media(max-width:640px){ .rz-side { grid-template-columns:1fr; gap:20px; } .rz-side aside { border-right:none; padding-right:0; border-bottom:1px solid var(--hairline); padding-bottom:20px; } .doc { padding:28px 22px; } }
.doc p { line-height:1.85; margin-top:10px; }
.doc-footer { margin-top:var(--s-6); padding-top:14px; border-top:1px solid var(--hairline); font-size:12px; color:var(--ink-faint); display:flex; justify-content:space-between; }
@media print {
  @page { margin:18mm; }
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .nav,.subnav,.sticky-bar,.no-print,[data-footer]{ display:none !important; }
  body { background:#fff; }
  .tile { padding:0 !important; background:#fff !important; }
  .doc { border:none; box-shadow:none; max-width:100%; padding:0; }
  .doc.editing { outline:none; }
  .cite__tip { display:none !important; }
}
</style>
</head>
<body>
<nav class="nav" data-nav></nav>

<div class="subnav no-print">
  <span class="subnav__title">문서 만들기</span>
  <div class="seg" style="margin-left:16px">
    <button id="tSelf" class="on" onclick="switchDoc('self')">자기소개서</button>
    <button id="tResume" onclick="switchDoc('resume')">이력서</button>
    <button id="tPortfolio" onclick="switchDoc('portfolio')">포트폴리오</button>
  </div>
  <span class="subnav__spacer"></span>
  <span class="caption">테마</span>
  <select id="themeColor" class="chip" style="padding:6px 10px" onchange="applyTheme()">
    <option value="#6C5CE7">퍼플</option><option value="#23407a">네이비</option>
    <option value="#8a2b3a">버건디</option><option value="#2f6b5e">그린</option><option value="#23222E">모노</option>
  </select>
  <select id="themeFont" class="chip" style="padding:6px 10px" onchange="applyTheme()">
    <option value="sans">고딕</option><option value="serif">명조</option>
  </select>
  <span class="caption" id="metaCount" style="margin-left:12px"></span>
</div>

<section class="tile tile--white compact no-print">
  <div class="container">
    <details>
      <summary class="caption" style="cursor:pointer">▸ 내 정보 (사진 · 연락처 · 학력) 편집 — 이력서/포트폴리오에 반영</summary>
      <div class="grid-2 mt-3" style="max-width:760px">
        <div><label class="label">이름</label><input class="field" id="pName" style="height:44px"></div>
        <div><label class="label">전화</label><input class="field" id="pPhone" placeholder="010-0000-0000" style="height:44px"></div>
        <div><label class="label">이메일</label><input class="field" id="pEmail" placeholder="you@univ.ac.kr" style="height:44px"></div>
        <div><label class="label">학교</label><input class="field" id="pSchool" placeholder="OO대학교" style="height:44px"></div>
        <div><label class="label">전공</label><input class="field" id="pMajor" placeholder="컴퓨터공학과" style="height:44px"></div>
        <div><label class="label">학년 / 졸업</label><input class="field" id="pGrade" placeholder="예: 4학년 / 2026 졸업예정" style="height:44px"></div>
      </div>
      <div class="mt-2" style="max-width:760px"><label class="label">증명사진</label>
        <input type="file" id="pPhoto" accept="image/*" onchange="onPhoto()" style="display:none">
        <button class="btn btn--dark" onclick="document.getElementById('pPhoto').click()">사진 선택</button>
        <span class="caption" id="photoState" style="margin-left:10px"></span></div>
      <div class="btn-row mt-3"><button class="btn btn--primary" onclick="saveProfile()">내 정보 저장</button></div>
    </details>
  </div>
</section>

<section class="tile tile--white compact no-print" id="selfControls">
  <div class="container">
    <p class="caption">자기소개서 · 문항 선택</p>
    <div class="btn-row mt-2" id="topicChips"></div>
  </div>
</section>

<input type="file" id="expImgInput" accept="image/*" multiple style="display:none">

<section class="tile tile--white compact no-print hidden" id="resumeControls">
  <div class="container">
    <div class="flex between items-center">
      <p class="caption">이력서에 넣을 경험 선택 · <span class="faint">⠿ 드래그로 순서 변경</span></p>
      <div class="btn-row">
        <span class="caption">템플릿</span>
        <select id="resumeTpl" class="chip" style="padding:6px 10px" onchange="setResumeTpl()">
          <option value="classic">클래식</option><option value="sidebar">사이드바</option>
          <option value="compact">컴팩트</option><option value="modern">모던</option><option value="minimal">미니멀</option>
        </select>
        <button class="chip chip--selectable" onclick="selectAllSel('resume', true)">전체 선택</button>
        <button class="chip chip--selectable" onclick="selectAllSel('resume', false)">전체 해제</button>
      </div>
    </div>
    <div id="resPicker" class="mt-2"></div>
  </div>
</section>

<section class="tile tile--white compact no-print hidden" id="portfolioControls">
  <div class="container">
    <div class="flex between items-center">
      <p class="caption">포트폴리오에 넣을 경험 선택 · <span class="faint">⠿ 드래그로 순서 변경</span></p>
      <div class="btn-row">
        <button class="chip chip--selectable" onclick="selectAllSel('portfolio', true)">전체 선택</button>
        <button class="chip chip--selectable" onclick="selectAllSel('portfolio', false)">전체 해제</button>
      </div>
    </div>
    <div id="pfPicker" class="mt-2"></div>
  </div>
</section>

<section class="tile tile--parchment" style="min-height:52vh">
  <div class="container">
    <div id="docEmpty" class="empty hidden"><h3 class="faint">경력을 먼저 등록하면 문서가 만들어집니다</h3>
      <div class="btn-row mt-3" style="justify-content:center"><a class="btn btn--primary" href="dashboard.html">경력관리로</a></div></div>
    <div id="docBody"></div>
  </div>
</section>

<div class="sticky-bar no-print">
  <span class="caption" id="counts"></span>
  <span class="sticky-bar__spacer"></span>
  <button class="btn btn--ghost" id="editBtn" onclick="toggleEdit()">편집</button>
  <button class="btn btn--ghost" onclick="regenerate()">AI 초안 다시 생성</button>
  <button class="btn btn--ghost" onclick="window.print()">PDF로 출력</button>
  <button class="btn btn--primary" id="copyBtn" onclick="copyDoc()">복사</button>
</div>

<script src="app.js"></script>
<script>
mountNav('studio');
if (requireAuth()) {
  Store.seedIfEmpty();
  const items = Store.items;
  const user = Session.user || { name: '학생' };
  let cur = 'self', curTopic = null, editing = false;
  const $ = s => document.getElementById(s);
  const DOC_DATE = new Date().toISOString().slice(0, 10);
  $('metaCount').textContent = `재료 ${items.length}건`;

  const reflection = (() => { try { return JSON.parse(localStorage.getItem('cda_reflection')) || []; } catch { return []; } })();
  const allEvidence = items.flatMap(x => x.competencies.map(c => ({ ...c, from: x.title })));
  const cite = (n, ev) => `<span class="cite">[${n}]<span class="cite__tip">${ev.evidence}<span class="src">${ev.src} · ${ev.from || ''}</span></span></span>`;
  const shell = (eyebrow, name, subLines, body, photo) => {
    const subs = (subLines || []).filter(Boolean).map(s => `<div class="doc-sub">${s}</div>`).join('');
    const pic = photo ? `<img class="doc-photo" src="${photo}" alt="">` : '';
    return `<div class="doc"><div class="doc-head" style="display:flex;gap:24px;align-items:flex-start">`
      + `<div style="flex:1"><div class="doc-eyebrow">${eyebrow}</div><h1 class="doc-t">${name}</h1>${subs}</div>${pic}</div>`
      + `${body}<div class="doc-footer"><span>PORTRI AI · 증거 기반 역량 리포트</span><span>${DOC_DATE}</span></div></div>`;
  };

  const TOPICS = {
    growth: { label: '성장 과정', build: () => [
      { t: '저는 경험을 근거로 성장하는 사람입니다.', ev: allEvidence[0] },
      allEvidence[1] ? { t: `${allEvidence[1].evidence} 경험은 그 태도를 보여줍니다.`, ev: allEvidence[1] } : { fill: '가장 의미 있었던 성장 경험' },
      { fill: '이 성장이 지원 직무와 이어지는 지점' },
    ]},
    strength: { label: '강점과 역량', build: () => {
      const top = items.flatMap(x => x.competencies).slice(0, 2);
      return [
        top[0] ? { t: `저의 대표 역량은 ${top[0].name}입니다.`, ev: top[0] } : { fill: '대표 역량' },
        top[1] ? { t: `또한 ${top[1].evidence}는 경험으로 ${top[1].name}을 길렀습니다.`, ev: top[1] } : { fill: '두 번째 역량' },
      ];
    }},
    challenge: { label: '도전과 극복', build: () => [
      reflection[1] ? { t: `“${reflection[1]}”`, ev: { evidence: reflection[1], src: '성찰록', from: 'AI 코칭' } } : { t: '한계에 부딪혔을 때 저는 근거로 판단했습니다.', ev: allEvidence[0] },
      { fill: '구체적으로 극복한 방법과 결과' },
    ]},
  };

  /* 편집/저장 */
  function docKey() { return cur === 'self' ? `cda_doc_self_${curTopic || 'none'}` : `cda_doc_${cur}`; }
  function applyDoc() {
    const el = document.querySelector('#docBody .doc'); if (!el) return;
    const saved = localStorage.getItem(docKey());
    if (saved) el.innerHTML = saved;
    el.setAttribute('contenteditable', editing);
    el.classList.toggle('editing', editing);
    el.oninput = () => localStorage.setItem(docKey(), el.innerHTML);
    themeToDoc(currentTheme());
  }
  /* 프로필(사진·연락처·학력) */
  function getProfile() { try { return JSON.parse(localStorage.getItem('cda_profile')) || {}; } catch { return {}; } }
  /* 문서별 경험 선택·순서(드래그) — 이력서·포트폴리오 공용 + 대표 이미지 */
  const SEL_KEY = { portfolio: 'cda_portfolio_sel', resume: 'cda_resume_sel' };
  const ORDER_KEY = { portfolio: 'cda_portfolio_order', resume: 'cda_resume_order' };
  const DOC_KEY = { portfolio: 'cda_doc_portfolio', resume: 'cda_doc_resume' };
  function getSel(type) {
    const raw = localStorage.getItem(SEL_KEY[type]);
    if (raw === null) return items.map(x => x.id);   // 기본: 전체 선택
    try { return JSON.parse(raw) || []; } catch { return items.map(x => x.id); }
  }
  function getOrder(type) {
    let order = null;
    try { order = JSON.parse(localStorage.getItem(ORDER_KEY[type])); } catch {}
    const ids = items.map(x => x.id);
    if (!Array.isArray(order)) order = ids.slice();
    order = order.filter(id => ids.includes(id));
    ids.forEach(id => { if (!order.includes(id)) order.push(id); });
    return order;
  }
  function orderedList(type) {
    const sel = getSel(type);
    return getOrder(type).filter(id => sel.includes(id)).map(id => items.find(x => x.id === id)).filter(Boolean);
  }
  function renderPicker(type) {
    const el = $(type === 'portfolio' ? 'pfPicker' : 'resPicker'); if (!el) return;
    const sel = getSel(type);
    const ordered = getOrder(type).map(id => items.find(x => x.id === id)).filter(Boolean);
    el.innerHTML = ordered.map(x => {
      const imgs = type === 'portfolio' ? getImgs(x) : [];
      const thumbs = imgs.length ? `<div style="display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 10px 44px">${imgs.map((im, i) => `
        <div class="imgblk">
          <div class="thumb"><img src="${im.src}"><button type="button" onclick="removeExpImage('${x.id}',${i})">×</button></div>
          <input class="field imgcap" value="${(im.caption || '').replace(/"/g, '&quot;')}" placeholder="캡션" oninput="setCaption('${x.id}',${i},this.value)">
          <div class="imgmove"><button type="button" onclick="moveImage('${x.id}',${i},-1)">◀</button><button type="button" onclick="moveImage('${x.id}',${i},1)">▶</button></div>
        </div>`).join('')}</div>` : '';
      return `<div class="flex items-center gap-2" style="padding:7px 0"
        draggable="true" ondragstart="dragStart('${x.id}')" ondragover="event.preventDefault()" ondrop="itemDrop('${type}','${x.id}')">
        <span class="caption" style="cursor:grab" title="드래그로 순서 변경">⠿</span>
        <input type="checkbox" ${sel.includes(x.id) ? 'checked' : ''} onchange="toggleSel('${type}','${x.id}',this.checked)">
        <span style="flex:1"><span class="exp-tag" style="font-size:11px;color:var(--color-primary);background:var(--accent-tint);padding:2px 8px;border-radius:999px">${CAT[x.category]?.label || ''}</span>
        <strong style="margin-left:6px">${x.title}</strong> <span class="caption">· ${x.date}</span></span>
        ${type === 'portfolio' ? `<button type="button" class="chip" onclick="pickExpImage('${x.id}')">🖼 이미지${imgs.length ? ` (${imgs.length})` : ''}</button>` : ''}
      </div>${thumbs}`;
    }).join('');
  }
  function reDoc(type) { if (cur === type) (type === 'portfolio' ? renderPortfolio() : renderResume()); }
  window.toggleSel = (type, id, checked) => {
    let sel = getSel(type);
    if (checked) { if (!sel.includes(id)) sel.push(id); } else sel = sel.filter(i => i !== id);
    localStorage.setItem(SEL_KEY[type], JSON.stringify(sel));
    localStorage.removeItem(DOC_KEY[type]);
    reDoc(type);
  };
  window.selectAllSel = (type, all) => {
    localStorage.setItem(SEL_KEY[type], JSON.stringify(all ? items.map(x => x.id) : []));
    localStorage.removeItem(DOC_KEY[type]);
    renderPicker(type); reDoc(type);
  };
  let _dragId = null;
  window.dragStart = (id) => { _dragId = id; };
  window.itemDrop = (type, targetId) => {
    if (!_dragId || _dragId === targetId) { _dragId = null; return; }
    const order = getOrder(type).filter(i => i !== _dragId);
    order.splice(order.indexOf(targetId), 0, _dragId);
    localStorage.setItem(ORDER_KEY[type], JSON.stringify(order));
    localStorage.removeItem(DOC_KEY[type]);
    _dragId = null;
    renderPicker(type); reDoc(type);
  };
  /* 경험 이미지(여러 장 · 캡션 · 순서) */
  function getImgs(x) {
    const arr = (x.images && x.images.length) ? x.images : (x.image ? [x.image] : []);
    return arr.map(im => typeof im === 'string' ? { src: im, caption: '' } : { src: im.src, caption: im.caption || '' });
  }
  function galFor(x) {
    const imgs = getImgs(x); if (!imgs.length) return '';
    return `<div class="pf-gallery${imgs.length === 1 ? ' one' : ''}">${imgs.map(im => `<figure><img src="${im.src}" alt="">${im.caption ? `<figcaption>${im.caption}</figcaption>` : ''}</figure>`).join('')}</div>`;
  }
  function persistImgs(id, arr, rerenderPicker) {
    const store = Store.items; const t = store.find(x => x.id === id); if (!t) return;
    t.images = arr; delete t.image; Store.items = store;
    const local = items.find(x => x.id === id); if (local) { local.images = arr; delete local.image; }
    localStorage.removeItem('cda_doc_portfolio');
    if (rerenderPicker) renderPicker('portfolio');
    if (cur === 'portfolio') renderPortfolio();
  }
  function downscale(file) {
    return new Promise(res => {
      const rd = new FileReader();
      rd.onload = e => { const img = new Image(); img.onload = () => {
        const w = Math.min(560, img.width), h = Math.round(img.height * (w / img.width));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', 0.82));
      }; img.src = e.target.result; };
      rd.readAsDataURL(file);
    });
  }
  window.pickExpImage = (id) => {
    const inp = $('expImgInput');
    inp.onchange = async () => {
      const files = Array.from(inp.files || []); if (!files.length) return;
      const arr = getImgs(items.find(x => x.id === id) || {});
      for (const f of files) arr.push({ src: await downscale(f), caption: '' });
      persistImgs(id, arr.slice(0, 8), true);   // 최대 8장
      inp.value = '';
    };
    inp.click();
  };
  window.removeExpImage = (id, idx) => { const arr = getImgs(items.find(x => x.id === id) || {}); arr.splice(idx, 1); persistImgs(id, arr, true); };
  window.setCaption = (id, idx, text) => { const arr = getImgs(items.find(x => x.id === id) || {}); if (arr[idx]) arr[idx].caption = text; persistImgs(id, arr, false); };
  window.moveImage = (id, idx, dir) => {
    const arr = getImgs(items.find(x => x.id === id) || {}); const j = idx + dir;
    if (j < 0 || j >= arr.length) return;
    [arr[idx], arr[j]] = [arr[j], arr[idx]]; persistImgs(id, arr, true);
  };

  /* 교과(성적) 요약 — 이력서/포트폴리오에 반영 */
  function curricularSummary() {
    const cur = (typeof Curricular !== 'undefined') ? Curricular.data : null;
    if (!cur || !cur.courses || !cur.courses.length) return null;
    let credits = 0, pts = 0;
    cur.courses.forEach(c => {
      const cr = Number(c.credit) || 0;
      const gp = (typeof GRADE_POINT !== 'undefined' ? GRADE_POINT[c.grade] : 0) || 0;
      credits += cr; pts += cr * gp;
    });
    const gpa = credits ? (pts / credits).toFixed(2) : '-';
    const agg = aggregateKCESA();
    const top = agg.labels.map((l, i) => ({ name: l, score: agg.curricular[i] }))
      .filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, 3);
    return { courses: cur.courses, credits, gpa, top };
  }
  window.onPhoto = () => {
    const f = $('pPhoto').files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const w = 208, h = Math.round(img.height * (w / img.width));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        window._photo = cv.toDataURL('image/jpeg', 0.82);
        $('photoState').textContent = '사진 준비됨 — [내 정보 저장]을 누르세요';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  };
  window.saveProfile = () => {
    const g = id => $(id).value.trim();
    const prev = getProfile();
    const p = { name: g('pName'), phone: g('pPhone'), email: g('pEmail'), school: g('pSchool'),
                major: g('pMajor'), grade: g('pGrade'), photo: window._photo || prev.photo || '' };
    localStorage.setItem('cda_profile', JSON.stringify(p));
    $('photoState').textContent = '저장됨 ✓';
    switchDoc(cur);
  };
  /* 테마(색·폰트) */
  function currentTheme() { try { return JSON.parse(localStorage.getItem('cda_doc_theme')) || { color: '#6C5CE7', font: 'sans' }; } catch { return { color: '#6C5CE7', font: 'sans' }; } }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
  function themeToDoc(t) {
    const el = document.querySelector('#docBody .doc'); if (!el) return;
    el.style.setProperty('--color-primary', t.color);
    el.style.setProperty('--color-primary-press', t.color);
    el.style.setProperty('--accent-tint', hexA(t.color, 0.12));
    el.style.setProperty('--accent-tint-strong', hexA(t.color, 0.2));
    el.style.fontFamily = t.font === 'serif' ? "'Newsreader','Pretendard Variable',Georgia,serif" : "var(--font-sans)";
  }
  window.applyTheme = () => {
    const t = { color: $('themeColor').value, font: $('themeFont').value };
    localStorage.setItem('cda_doc_theme', JSON.stringify(t));
    themeToDoc(t);
  };
  window.toggleEdit = () => {
    editing = !editing;
    const b = $('editBtn'); b.textContent = editing ? '편집 완료' : '편집'; b.classList.toggle('btn--primary', editing);
    const el = document.querySelector('#docBody .doc');
    if (el) { el.setAttribute('contenteditable', editing); el.classList.toggle('editing', editing);
      if (editing) el.focus(); else localStorage.setItem(docKey(), el.innerHTML); }
  };
  window.regenerate = () => {
    if (!confirm('AI 초안으로 다시 생성하면 편집 내용이 사라집니다. 계속할까요?')) return;
    localStorage.removeItem(docKey()); switchDoc(cur);
  };
  window.copyDoc = () => {
    const el = document.querySelector('#docBody .doc'); const t = el ? el.innerText : '';
    navigator.clipboard?.writeText(t).then(() => { const b = $('copyBtn'); b.textContent = '복사됨 ✓'; setTimeout(() => b.textContent = '복사', 1500); });
  };

  function switchDoc(d) {
    cur = d;
    const label = d === 'self' ? '자기소개서' : d === 'resume' ? '이력서' : '포트폴리오';
    document.title = `${(getProfile().name || user.name || 'PORTRI')}_${label}`;  // PDF 저장 파일명
    ['self', 'resume', 'portfolio'].forEach(k => $('t' + k.charAt(0).toUpperCase() + k.slice(1)).classList.toggle('on', k === d));
    $('selfControls').classList.toggle('hidden', d !== 'self');
    $('resumeControls').classList.toggle('hidden', d !== 'resume');
    $('portfolioControls').classList.toggle('hidden', d !== 'portfolio');
    if (items.length === 0) { $('docEmpty').classList.remove('hidden'); $('docBody').innerHTML = ''; $('counts').textContent = ''; return; }
    $('docEmpty').classList.add('hidden');
    if (d === 'self') renderSelf();
    else if (d === 'resume') { renderPicker('resume'); renderResume(); }
    else { renderPicker('portfolio'); renderPortfolio(); }
  }
  window.switchDoc = switchDoc;

  /* 자기소개서 */
  function renderSelf() {
    $('topicChips').innerHTML = Object.entries(TOPICS).map(([k, v]) =>
      `<button class="chip chip--selectable ${curTopic === k ? 'chip--selected' : ''}" onclick="pickTopic('${k}')">${v.label}</button>`).join('');
    if (!curTopic) { $('docBody').innerHTML = '<p class="muted center mt-6">위에서 문항을 선택하세요.</p>'; $('counts').textContent = ''; return; }
    const parts = TOPICS[curTopic].build();
    let n = 0, c = 0;
    const html = parts.map(p => {
      if (p.fill) return `<p><span class="essay-fill">[직접 채우기: ${p.fill}]</span></p>`;
      if (!p.ev) return '';
      n++; c++;
      return `<p>${p.t} ${cite(c, p.ev)}</p>`;
    }).join('');
    $('docBody').innerHTML = shell(`자기소개서 — ${TOPICS[curTopic].label}`, getProfile().name || user.name, [], html);
    $('counts').textContent = `문장 ${n} · 인용 ${c}`;
    applyDoc();
  }
  window.pickTopic = k => { curTopic = k; renderSelf(); };

  /* 이력서 */
  function renderResume() {
    const list = orderedList('resume');
    const byCat = {};
    list.forEach(x => { (byCat[x.category] = byCat[x.category] || []).push(x); });
    const topComp = Object.entries(list.flatMap(x => x.competencies).reduce((m, c) => { m[c.name] = (m[c.name] || 0) + 1; return m; }, {}))
      .sort((a, b) => b[1] - a[1]).slice(0, 4).map(([n]) => n);
    const sections = CATEGORIES.filter(c => byCat[c.key]).map(c => `
      <div class="doc-section"><h3>${c.label}</h3>
      ${byCat[c.key].map(x => `<div class="res-row"><div class="res-date">${x.date}</div>
        <div><strong>${x.title}</strong>${x.org ? ` <span class="caption">· ${x.org}</span>` : ''}
        ${x.description ? `<div class="caption mt-1">${x.description}</div>` : ''}
        <div class="exp-card__chips mt-1">${x.competencies.map(cc => `<span class="comp-chip">${cc.name}</span>`).join('')}</div></div></div>`).join('')}
      </div>`).join('');
    const cs = curricularSummary();
    const academic = cs ? `<div class="doc-section"><h3>학업 · 교과 이수</h3>
      <p class="caption">이수 ${cs.courses.length}과목 · ${cs.credits}학점 · 평점(GPA) ${cs.gpa}${cs.top.length ? ' · 교과 기반 역량 ' + cs.top.map(t => t.name).join(', ') : ''}</p>
      ${cs.courses.map(c => `<div class="res-row"><div class="res-date">${c.division || ''}</div><div><strong>${c.name}</strong> <span class="caption">· ${c.credit}학점 · ${c.grade}</span></div></div>`).join('')}
      </div>` : '';
    const note = `<p class="fine mt-4">본 이력서의 모든 항목은 증빙자료에 근거합니다. (총 ${list.length}건)</p>`;
    const coreChips = `<div class="exp-card__chips">${topComp.map(n => `<span class="comp-chip">${n}</span>`).join('')}</div>`;
    const p = getProfile();
    const contact = [p.phone, p.email || user.email].filter(Boolean).join(' · ');
    const edu = [p.school, p.major, p.grade].filter(Boolean).join(' · ');
    $('docBody').innerHTML = resumeDoc(getResumeTpl(), { name: p.name || user.name, contact, edu, photo: p.photo, coreChips, academic, sections, note });
    $('counts').textContent = `경력 ${list.length}건 · 역량 ${topComp.length}`;
    applyDoc();
  }
  function getResumeTpl() { return localStorage.getItem('cda_resume_tpl') || 'classic'; }
  window.setResumeTpl = () => { localStorage.setItem('cda_resume_tpl', $('resumeTpl').value); localStorage.removeItem('cda_doc_resume'); renderResume(); };
  function resumeDoc(tpl, d) {
    const core = `<div class="doc-section"><h3>핵심 역량</h3>${d.coreChips}</div>`;
    const footer = `<div class="doc-footer"><span>PORTRI AI · 증거 기반 역량 리포트</span><span>${DOC_DATE}</span></div>`;
    if (tpl === 'sidebar') {
      return `<div class="doc tpl-sidebar"><div class="rz-side">
        <aside>${d.photo ? `<img class="doc-photo" src="${d.photo}">` : ''}
          <div class="doc-eyebrow" style="margin-top:10px">이력서</div><h1 class="doc-t" style="font-size:1.7rem">${d.name}</h1>
          ${d.contact ? `<div class="doc-sub">${d.contact}</div>` : ''}${d.edu ? `<div class="doc-sub">${d.edu}</div>` : ''}
          ${core}</aside>
        <main>${d.academic}${d.sections}${d.note}</main></div>${footer}</div>`;
    }
    const head = `<div class="doc-head" style="display:flex;gap:24px;align-items:flex-start">
      <div style="flex:1"><div class="doc-eyebrow">이력서 · RÉSUMÉ</div><h1 class="doc-t">${d.name}</h1>
        ${d.contact ? `<div class="doc-sub">${d.contact}</div>` : ''}${d.edu ? `<div class="doc-sub">${d.edu}</div>` : ''}</div>
      ${d.photo ? `<img class="doc-photo" src="${d.photo}">` : ''}</div>`;
    return `<div class="doc tpl-${tpl}">${head}${core}${d.academic}${d.sections}${d.note}${footer}</div>`;
  }

  /* 포트폴리오 */
  function renderPortfolio() {
    let c = 0;
    const cs = curricularSummary();
    const curBlock = cs ? `<div class="doc-section"><h3>교과 역량</h3>
      <p class="caption">전공·교양 이수에서 드러난 역량 · 평점(GPA) ${cs.gpa}</p>
      <div class="exp-card__chips mt-2">${cs.top.map(t => `<span class="comp-chip">${t.name} ${t.score}점</span>`).join('')}</div></div>` : '';
    const list = orderedList('portfolio');
    if (list.length === 0) {
      $('docBody').innerHTML = shell('포트폴리오', `${(getProfile().name || user.name)}의 역량 자산`, [], curBlock + '<p class="muted center mt-5">넣을 경험을 위에서 선택하세요.</p>', getProfile().photo);
      $('counts').textContent = '경험 0건'; applyDoc(); return;
    }
    const body = curBlock + list.map(x => {
      const chips = x.competencies.map(cc => { c++; return `<span class="comp-chip">${cc.name} ${cite(c, { ...cc, from: x.title })}</span>`; }).join('');
      return `<div class="pf-item">${galFor(x)}<span class="exp-tag" style="font-size:11px;color:var(--color-primary);background:var(--accent-tint);padding:3px 10px;border-radius:999px">${CAT[x.category]?.label}</span>
        <h3 style="margin-top:8px">${x.title}</h3>
        <p class="caption">${x.date}${x.org ? ` · ${x.org}` : ''}${x.description ? ` · ${x.description}` : ''} · 등록번호 ${x.id}</p>
        <p>${x.star.a}</p>
        <div class="exp-card__chips mt-2">${chips}</div></div>`;
    }).join('');
    const p = getProfile();
    const contact = [p.phone, p.email || user.email].filter(Boolean).join(' · ');
    $('docBody').innerHTML = shell('포트폴리오', `${p.name || user.name}의 역량 자산`, [`증거로 검증된 ${list.length}개의 경험`, contact], body, p.photo);
    $('counts').textContent = `경험 ${list.length}건 · 인용 ${c}`;
    applyDoc();
  }

  // 초기값: 프로필 입력 채우기 + 테마 선택값
  (() => {
    const p = getProfile();
    $('pName').value = p.name || user.name || '';
    $('pPhone').value = p.phone || ''; $('pEmail').value = p.email || user.email || '';
    $('pSchool').value = p.school || ''; $('pMajor').value = p.major || ''; $('pGrade').value = p.grade || '';
    const t = currentTheme(); $('themeColor').value = t.color; $('themeFont').value = t.font;
    $('resumeTpl').value = getResumeTpl();
  })();
  switchDoc('self');
}
</script>
</body>
</html>
